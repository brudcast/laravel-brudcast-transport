name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, format and analyse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.4"
          coverage: none
      - run: composer validate --strict
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      - run: composer audit
      - run: vendor/bin/pint --test
      - run: vendor/bin/phpstan analyse --no-progress --error-format=github
      - uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0

  test:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}${{ matrix.dependencies == 'lowest' && ' (lowest)' || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Laravel 12 supports PHP 8.2+, Laravel 13 supports PHP 8.3+
        php: ["8.2", "8.3", "8.4", "8.5"]
        laravel: ["12", "13"]
        dependencies: ["highest"]
        exclude:
          - { php: "8.2", laravel: "13" }
        include:
          - { php: "8.2", laravel: "12", dependencies: "lowest" }
          - { php: "8.4", laravel: "13", coverage: true }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: ${{ matrix.coverage && 'pcov' || 'none' }}
      - name: Pin the Laravel version
        run: |
          composer require --no-update --no-interaction \
            "illuminate/console:^${{ matrix.laravel }}.0" \
            "illuminate/contracts:^${{ matrix.laravel }}.0" \
            "illuminate/mail:^${{ matrix.laravel }}.0" \
            "illuminate/support:^${{ matrix.laravel }}.0"
          composer require --dev --no-update --no-interaction \
            "orchestra/testbench:^$(( ${{ matrix.laravel }} - 2 )).0"
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          dependency-versions: ${{ matrix.dependencies }}
      - name: Show the resolved versions
        run: |
          for package in laravel/framework symfony/mailer guzzlehttp/guzzle; do
            composer show "$package" | grep -E '^(name|versions) '
          done
      - if: ${{ !matrix.coverage }}
        run: vendor/bin/phpunit
      - if: ${{ matrix.coverage }}
        run: composer test:coverage
      - name: Check line coverage
        if: ${{ matrix.coverage }}
        env:
          MIN_LINE_COVERAGE: 95
        run: |
          php -r '
            $metrics = simplexml_load_file("coverage/clover.xml")->project->metrics;
            $coverage = 100 * (int) $metrics["coveredstatements"] / max(1, (int) $metrics["statements"]);
            printf("Line coverage: %.2f%% (minimum %d%%)\n", $coverage, getenv("MIN_LINE_COVERAGE"));
            exit($coverage < (float) getenv("MIN_LINE_COVERAGE") ? 1 : 0);
          '
      - name: Upload coverage to Codecov
        if: ${{ matrix.coverage }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage/clover.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
