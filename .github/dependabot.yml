version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    versioning-strategy: widen
    groups:
      dev-dependencies:
        dependency-type: development
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
